apiVersion: apps/v1
kind: Deployment

metadata:
  name: securebank
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: securebank

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:

    metadata:
      labels:
        app: securebank

    spec:
      containers:

        - name: securebank

          image: devopsbyrushi/securebank:IMAGE_TAG

          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
